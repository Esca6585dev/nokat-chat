services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nokat
      POSTGRES_PASSWORD: nokat
      POSTGRES_DB: nokat
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nokat"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_DRIVER: postgres
      DB_DSN: postgres://nokat:nokat@postgres:5432/nokat?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      OTP_DEV_MODE: ${OTP_DEV_MODE:-true}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
